# MRHA default config — Phase A research harness (0.2.0)
n_items: 200
seed: 42

source: synthetic  # synthetic | chartqa | mixed

protocols:
  - invariance
  - re_answer

attacks:
  - evidence_swap
  - evidence_destroy
  - wrong_caption
  - judge_bait
  - nuisance

model:
  backend: mlx   # mlx | api | echo
  id: mlx-community/Qwen2-VL-7B-Instruct-4bit
  max_tokens: 128

judge:
  # Set backend to enable weak_vlm_judge (same model or a second client).
  # Default audit runs outcome_only + keyword_match + gold_overlap only.
  backend: null   # null | mlx | api | echo
  id: null

paths:
  benchmark: data/benchmark
  manifest: data/benchmark/manifest.jsonl
  results: results
  raw: data/raw
  labels: data/labels/detector_labels.jsonl

metrics:
  rhr_proxy: keyword_match
  numeric_tol: 0.51
